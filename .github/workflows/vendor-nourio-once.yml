name: Vendor Nourio Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact page requisites
        run: |
          rm -rf /tmp/nourio-vendor public/nourio-vendor
          mkdir -p /tmp/nourio-vendor public/nourio-vendor
          wget -e robots=off --page-requisites --convert-links --adjust-extension --no-parent --directory-prefix=/tmp/nourio-vendor https://dev266.kodesolution.com/nourio/home-video1/
          cp -a /tmp/nourio-vendor/dev266.kodesolution.com/nourio/. public/nourio-vendor/
      - name: Scrub external runtime dependencies and apply Ilama content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("public/nourio-vendor/home-video1/index.html")
          s=p.read_text(errors="ignore")
          repl={
            "Nourio":"ILAMA BLOOM",
            "Nutrition Care You Can Trust":"Knowledge that blooms with you.",
            "Healthy eating solutions tailored to your unique lifestyle":"Explore food, understand your body, build healthier habits, and grow — at every age.",
            "Expert nutrition solutions that fit tour health":"Food · Body · Context",
            "Evidence based nutrition solutions for long term health":"Clear nutrition knowledge for real everyday life",
            "Our simple process for achieving better health":"A clearer way to explore nutrition",
            "Meet the team behind your device repairs":"Meet Dr. Dina Hassan",
            "Answers to your charging questions":"Questions worth exploring",
            "The perfect nutrition plan for your health goals":"Food knowledge for every stage of life",
            "The latest insights on nutrition health":"Explore the latest from Ilama Bloom",
          }
          for a,b in repl.items(): s=s.replace(a,b)
          s=re.sub(r'<link[^>]+(?:fonts\.googleapis|fonts\.gstatic|cloudflare)[^>]*>','',s,flags=re.I)
          s=re.sub(r'<script[^>]+(?:cloudflare|googletag|google-analytics)[^>]*>.*?</script>','',s,flags=re.I|re.S)
          s=re.sub(r'<iframe[^>]+(?:youtube|vimeo)[^>]*>.*?</iframe>','',s,flags=re.I|re.S)
          s=s.replace("https://dev266.kodesolution.com/nourio/","/nourio-vendor/")
          s=s.replace("http://dev266.kodesolution.com/nourio/","/nourio-vendor/")
          p.write_text(s)
          PY
          grep -RIlE 'https?://dev266\.kodesolution\.com|//dev266\.kodesolution\.com|fonts\.googleapis\.com|fonts\.gstatic\.com|cloudflareinsights\.com' public/nourio-vendor && exit 1 || true
      - name: Commit vendored template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/nourio-vendor
          git diff --cached --quiet && exit 0
          git commit -m "vendor: localize Nourio assets with zero runtime upstream dependency"
          git push
